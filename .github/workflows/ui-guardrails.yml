name: UI Guardrails (Secrets + File Policy)

on:
  pull_request:
    branches: ["ui-base", "main"]

jobs:
  secret-and-file-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Block forbidden files for UI-only contributors
        run: |
          set -e

          if grep -E '(^|/)(\.env($|\.)|id_rsa|id_dsa|.*\.pem$|.*\.p12$|.*\.key$|service_account.*\.json$)' changed_files.txt; then
            echo "Error: PR includes forbidden secret/cert files."
            exit 1
          fi

      - name: Install gitleaks CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          gitleaks version

      - name: Secret scan with Gitleaks (PR commit range only)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          gitleaks git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Fail if obvious secret strings detected in diff
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff "$BASE_SHA" "$HEAD_SHA" | \
            grep -E 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE|API[_-]?KEY|SECRET[_-]?KEY|PRIVATE[_-]?KEY|BEGIN PRIVATE KEY' && \
            { echo "Error: possible secret detected in PR diff"; exit 1; } || true
