name: Playwright E2E

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'lib/**'
      - 'backend/**'
      - 'tests/**'
      - 'playwright.config.ts'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
