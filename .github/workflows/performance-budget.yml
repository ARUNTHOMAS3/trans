name: Performance Budget Checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'backend/**'

jobs:
  frontend-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded color guard (migration governance)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED_DART < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^lib/.*\.dart$' || true)
          if (( ${#CHANGED_DART[@]} == 0 )); then
            echo "No changed Dart UI files."
            exit 0
          fi
          if grep -n "Color(0x" "${CHANGED_DART[@]}"; then
            echo "Hardcoded color literals detected in changed UI files."
            exit 1
          fi

  backend-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic N+1 / non-paginated list heuristic
        run: |
          if grep -R -n -E "findAll\(|SELECT \*" backend/src/modules 2>/dev/null; then
            echo "Review required for possible broad fetch patterns."
          fi
