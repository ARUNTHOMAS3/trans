name: Branch CI + PR Conflict Guard

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: branch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_build:
    name: Backend Build (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  frontend_analyze_and_build:
    name: Frontend Analyze + Build (Flutter)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate assets/.env for CI
        shell: bash
        run: |
          mkdir -p assets
          cat > assets/.env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          API_BASE_URL=${API_BASE_URL:-http://localhost:3001}
          ENVIRONMENT=${ENVIRONMENT:-ci}
          SENTRY_DSN=${SENTRY_DSN}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze frontend
        run: flutter analyze --no-fatal-infos

      - name: Build frontend web
        run: flutter build web --release

  pr_merge_conflict_guard:
    name: PR Merge Conflict Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Try merge base into PR head
        id: mergecheck
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/${{ github.event.pull_request.base.ref }}
          MERGE_EXIT=$?
          if [ $MERGE_EXIT -ne 0 ]; then
            echo "conflict=true" >> $GITHUB_OUTPUT
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflict_files=$CONFLICT_FILES" >> $GITHUB_OUTPUT
            git merge --abort || true
            exit 1
          fi
          echo "conflict=false" >> $GITHUB_OUTPUT
          git merge --abort || true

      - name: Comment conflict details on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-merge-conflict-guard -->';
            const files = `${{ steps.mergecheck.outputs.conflict_files }}`.trim();
            const body = `${marker}
            ❌ Merge conflict detected with base branch \`${{ github.event.pull_request.base.ref }}\`.

            Conflicting files:
            \`\`\`
            ${files || 'Unable to resolve file list.'}
            \`\`\`

            Please resolve conflicts locally and push again.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
