name: PR Governance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Allowlist PR actor (strict)
        run: |
          ACTOR="${{ github.actor }}"
          case "$ACTOR" in
            frpboy|Zabnix-Private-Limited|PlatformCatalyst-Zabnix) echo "Authorized PR actor: $ACTOR" ;;
            *) echo "PR rejected. Actor not allowed: $ACTOR"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            security
            style
            chore
      - name: Validate base branch
        run: |
          BASE="${{ github.base_ref }}"
          case "$BASE" in
            dev|main) echo "Base branch allowed: $BASE" ;;
            *) echo "PRs may target only dev or main"; exit 1 ;;
          esac
      - name: Validate source branch naming
        run: |
          HEAD="${{ github.head_ref }}"
          if [[ ! "$HEAD" =~ ^((feature|fix|bugfix|perf|hotfix|docs)\/|PlatformCatalyst-Zabnix\/|dependabot\/) ]]; then
            echo "Invalid branch prefix: $HEAD"
            exit 1
          fi
