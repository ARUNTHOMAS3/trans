name: Flutter Quality

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches: [dev, main]
    paths:
      - 'lib/**'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
