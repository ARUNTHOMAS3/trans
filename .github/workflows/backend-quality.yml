name: Backend Quality

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --passWithNoTests
        env:
          DRIZZLE_DATABASE_URL: ${{ secrets.DRIZZLE_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres' }}
